name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - name: gcc
            cc: gcc
            cxx: g++
          - name: clang
            cc: clang
            cxx: clang++
    name: ${{ matrix.compiler.name }} release build
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
      CXXFLAGS: -Wall -Wextra -Wpedantic -Werror
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test synthetic health check
        run: ctest --test-dir build --output-on-failure

  portability:
    runs-on: macos-latest
    name: Apple Clang release build
    env:
      CXXFLAGS: -Wall -Wextra -Wpedantic -Werror
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  sanitizers:
    runs-on: ubuntu-latest
    name: Address and undefined behavior sanitizers
    env:
      CC: clang
      CXX: clang++
      CXXFLAGS: -Wall -Wextra -Wpedantic -Werror -fsanitize=address,undefined -fno-omit-frame-pointer
      LDFLAGS: -fsanitize=address,undefined
    steps:
      - uses: actions/checkout@v4
      - name: Configure debug instrumentation
        run: cmake -S . -B build-sanitized -DCMAKE_BUILD_TYPE=Debug
      - name: Build instrumented binary
        run: cmake --build build-sanitized --parallel
      - name: Run health check under sanitizers
        env:
          ASAN_OPTIONS: detect_leaks=1:halt_on_error=1
          UBSAN_OPTIONS: halt_on_error=1:print_stacktrace=1
        run: ctest --test-dir build-sanitized --output-on-failure

  container:
    runs-on: ubuntu-latest
    name: Container smoke test
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --tag telemetry-guard:test .
      - name: Verify version and non-root runtime
        run: |
          docker run --rm telemetry-guard:test | grep --fixed-strings "TelemetryGuard 0.2.0"
          test "$(docker inspect --format '{{.Config.User}}' telemetry-guard:test)" = "65532:65532"
      - name: Process telemetry from standard input
        run: |
          docker run --rm --interactive telemetry-guard:test \
            --csv - --json --fail-on never < examples/readings.csv > container-report.json
          python3 - <<'PY'
          import json

          with open("container-report.json", encoding="utf-8") as report_file:
              report = json.load(report_file)

          assert report["summary"]["disposition"] in {"GO", "MONITOR", "HOLD"}
          assert len(report["channels"]) > 0
          PY

  packages:
    runs-on: ubuntu-latest
    name: Verified release packages
    permissions:
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@v4
      - name: Configure production package
        run: cmake -S . -B build-package -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF
      - name: Build production binary
        run: cmake --build build-package --parallel
      - name: Create release archives and checksums
        run: |
          cpack --config build-package/CPackConfig.cmake -B dist
          cd dist
          sha256sum -- *.tar.gz *.zip > SHA256SUMS
          sha256sum --check SHA256SUMS
      - name: Verify packaged CLI and archive contents
        run: |
          mkdir package-check
          tar --extract --gzip --file "$(find dist -maxdepth 1 -name '*.tar.gz' -print -quit)" \
            --directory package-check
          packaged_cli="$(find package-check -type f -path '*/bin/telemetry_guard' -print -quit)"
          test -n "$packaged_cli"
          "$packaged_cli" --version | grep --fixed-strings "TelemetryGuard 0.2.0"
          unzip -l "$(find dist -maxdepth 1 -name '*.zip' -print -quit)" \
            | grep --fixed-strings "bin/telemetry_guard"
      - name: Build image for software inventory
        run: docker build --tag telemetry-guard:sbom .
      - name: Generate SPDX software bill of materials
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: telemetry-guard:sbom
          format: spdx-json
          output-file: dist/telemetryguard.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Validate SPDX inventory
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          sbom_path = Path("dist/telemetryguard.spdx.json")
          document = json.loads(sbom_path.read_text(encoding="utf-8"))
          assert document["spdxVersion"] == "SPDX-2.3"
          assert document["SPDXID"] == "SPDXRef-DOCUMENT"
          assert document["documentNamespace"].startswith("https://")
          assert document["packages"], "SBOM must contain at least one package"
          assert all(package.get("SPDXID") for package in document["packages"])
          PY
      - name: Attest release provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
            dist/telemetryguard.spdx.json
      - name: Upload verified distributions
        uses: actions/upload-artifact@v4
        with:
          name: telemetryguard-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/SHA256SUMS
            dist/telemetryguard.spdx.json
          if-no-files-found: error
          retention-days: 30
