name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build --config Release
      - name: Run health check scenario
        shell: bash
        run: |
          set +e
          output=$(./build/telemetry_guard 2>&1)
          status=$?
          set -e
          echo "$output"
          test "$status" -eq 1
          grep -q "Priority channel:" <<< "$output"
          grep -q "Vehicle disposition:" <<< "$output"
